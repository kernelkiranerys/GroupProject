{% extends "base.html" %}
{% load static %}

{% block extra_head %}
<link
  rel="stylesheet"
  href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
  crossorigin=""
/>
{% endblock %}

{% block content %}
<div class="map-page-container">
  <h3>Outdoor Air Quality</h3>
  <div id="uk-air-quality-map" class="full-page-map" aria-label="UK air quality map"></div>
  <div class="aq-map-legend" aria-label="Air quality legend">
    <span><i class="aq-map-dot aq-map-dot--good"></i> Good</span>
    <span><i class="aq-map-dot aq-map-dot--moderate"></i> Moderate</span>
    <span><i class="aq-map-dot aq-map-dot--poor"></i> Poor</span>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script
  src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
  crossorigin=""
></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
    var map = L.map('uk-air-quality-map').setView([53.8008, -1.5491], 10);

    L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
        subdomains: 'abcd',
        maxZoom: 19
    }).addTo(map);

    fetch("{% url 'Hyper_Local_Weather:uk_air_quality_data' %}")
        .then(response => response.json())
        .then(data => {
            data.forEach(function(point) {
                var color;
                if (point.zone === 'good') {
                    color = '#2ecc71';
                } else if (point.zone === 'moderate') {
                    color = '#f39c12';
                } else {
                    color = '#e74c3c';
                }

                L.circleMarker([point.latitude, point.longitude], {
                    radius: 8,
                    fillColor: color,
                    color: "#fff",
                    weight: 1,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map).bindPopup('<b>' + point.name + '</b><br>PM2.5: ' + point.pm25 + ' µg/m³');
            });
        });
});
</script>
{% endblock %}
